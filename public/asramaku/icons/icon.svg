<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f43f5e" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- App Background Shape -->
  <rect x="32" y="32" width="448" height="448" rx="110" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Glass Highlight -->
  <rect x="48" y="48" width="416" height="200" rx="90" fill="white" opacity="0.15" />
  
  <!-- Center Motif: Crescent & Blossom / Dome Aesthetic -->
  <g transform="translate(256, 256)">
    <!-- Central Flower Petals -->
    <circle cx="0" cy="-60" r="45" fill="#ffffff" opacity="0.95" />
    <circle cx="57" cy="-18" r="45" fill="#ffffff" opacity="0.95" />
    <circle cx="35" cy="50" r="45" fill="#ffffff" opacity="0.95" />
    <circle cx="-35" cy="50" r="45" fill="#ffffff" opacity="0.95" />
    <circle cx="-57" cy="-18" r="45" fill="#ffffff" opacity="0.95" />
    <!-- Center Core -->
    <circle cx="0" cy="0" r="32" fill="#fef08a" />
    <circle cx="0" cy="0" r="18" fill="#f59e0b" />
  </g>
  
  <!-- Soft text label -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="1">AsramaKu</text>
</svg>
